name: Core hardening acceptance
on:
  pull_request:
  push:
    branches: [main, 'codex/5.1.2-security-hardening']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-only
          MYSQL_DATABASE: redcms_ci_unused
          MYSQL_USER: redcms_ci
          MYSQL_PASSWORD: ci-disposable-app
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-disposable-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      RED_DB_HOST: 127.0.0.1
      RED_DB_PORT: '3306'
      RED_DB_USER: redcms_ci
      RED_DB_PASS: ci-disposable-app
      RED_DB_NAME: redcms_ci_unused
      RED_ACCEPTANCE_DB_ADMIN_PASS: ci-disposable-only
      RED_LOCAL_CONFIG: /tmp/redcms-no-local-config.php
      FRANKENPHP_BIN: /tmp/frankenphp
      RED_STRIPE_ADAPTER_ROOT: ${{ github.workspace }}/.ci-fixtures/stripe/package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout offline Stripe contract fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: orojas01-glitch/redcms-store-lite-stripe-checkout
          ref: 35a7b4bcb1dba1cf94e3d51ea50658b57ef09874
          path: .ci-fixtures/stripe
          persist-credentials: false
      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-xml php-mbstring default-mysql-client shellcheck apache2-bin
          curl --fail --location --silent --show-error https://github.com/php/frankenphp/releases/download/v1.12.4/frankenphp-linux-x86_64 -o /tmp/frankenphp
          echo 'b39c7511483c99faf0d857cc0789b39cc23023038260b31d4b40dd4ae18795dc  /tmp/frankenphp' | sha256sum -c -
          chmod +x /tmp/frankenphp
      - name: Shell warnings and errors
        run: git ls-files -z 'scripts/*.sh' | xargs -0 shellcheck -S warning
      - name: Core, offline adapter and theme contracts
        run: scripts/core-security-checks.sh
      - name: Apache artifact boundary
        run: RED_HTTPD_BIN=/usr/sbin/apache2 RED_APACHE_MODULES=/usr/lib/apache2/modules python3 scripts/apache-boundary-self-test.py
      - name: Retired legacy payment boundary
        run: python3 scripts/legacy-pdt-retirement-self-test.py
      - name: HTTP session policy
        run: python3 scripts/admin-session-http-self-test.py
      - name: HTTP CSP policy and configuration refusal
        run: python3 scripts/csp-http-self-test.py
      - name: Disposable authentication, migrations, CRUD and rollback
        run: scripts/hardening-full-acceptance.sh
      - name: Install locked browser acceptance tools
        run: |
          npm ci --prefix scripts/browser-qa --ignore-scripts --no-audit --no-fund
          scripts/browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser CSP enforcement and editor compatibility
        env:
          RED_PLAYWRIGHT_MODULE: ${{ github.workspace }}/scripts/browser-qa/node_modules/playwright
          RED_PHP_BIN: /usr/bin/php
          RED_TINYMCE_QA_OUTPUT: /tmp/redcms-tinymce-csp-qa
        run: |
          node scripts/csp-browser-qa.mjs
          node scripts/tinymce-browser-qa.mjs
  scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned scanners
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Current tracked source only
        run: python3 scripts/security-scan.py
      - name: Historical secrets (redacted; unresolved findings fail)
        if: always()
        run: gitleaks git --redact=100 --no-banner --log-opts=HEAD
      - name: Public dependency coordinates only
        if: always()
        run: osv-scanner scan source -L release/bundled-dependencies.cdx.json
      - name: Public browser tooling dependency coordinates
        if: always()
        run: osv-scanner scan source -L scripts/browser-qa/package-lock.json
